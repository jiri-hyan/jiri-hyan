<svg xmlns="http://www.w3.org/2000/svg" width="495" height="250" viewBox="0 0 495 250" role="img" aria-label="GitHub stats — real language mix including private work">
  <title>Jiří Hyan — GitHub Stats (real language mix, incl. private)</title>
  <rect x="0.5" y="0.5" width="494" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- title -->
  <text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3FB950">GitHub Stats</text>
  <text x="141" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">· real mix, incl. private</text>

  <!-- stat tiles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="24"  y="88"  font-size="26" font-weight="700" fill="#ffffff">31</text>
    <text x="24"  y="106" font-size="11" fill="#8b949e">Repositories</text>
    <text x="190" y="88"  font-size="26" font-weight="700" fill="#ffffff">5,002</text>
    <text x="190" y="106" font-size="11" fill="#8b949e">Contributions · 1y</text>
    <text x="392" y="88"  font-size="26" font-weight="700" fill="#ffffff">18</text>
    <text x="392" y="106" font-size="11" fill="#8b949e">Languages</text>
  </g>

  <!-- language mix -->
  <text x="24" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">Language mix</text>
  <clipPath id="bar"><rect x="24" y="150" width="447" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar)">
    <rect x="24"    y="150" width="188.6" height="12" fill="#3178c6"/>
    <rect x="212.6" y="150" width="129.6" height="12" fill="#e34c26"/>
    <rect x="342.2" y="150" width="83.6"  height="12" fill="#f1e05a"/>
    <rect x="425.8" y="150" width="16.1"  height="12" fill="#A97BFF"/>
    <rect x="441.9" y="150" width="15.6"  height="12" fill="#178600"/>
    <rect x="457.5" y="150" width="6.7"   height="12" fill="#F05138"/>
    <rect x="464.2" y="150" width="4.5"   height="12" fill="#563d7c"/>
    <rect x="468.7" y="150" width="2.3"   height="12" fill="#8b949e"/>
  </g>

  <!-- legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c9d1d9">
    <circle cx="28"  cy="192" r="4" fill="#3178c6"/><text x="38"  y="196">TypeScript 42%</text>
    <circle cx="154" cy="192" r="4" fill="#e34c26"/><text x="164" y="196">HTML 29%</text>
    <circle cx="288" cy="192" r="4" fill="#f1e05a"/><text x="298" y="196">JavaScript 19%</text>
    <circle cx="392" cy="192" r="4" fill="#A97BFF"/><text x="402" y="196">Kotlin 4%</text>
    <circle cx="28"  cy="216" r="4" fill="#178600"/><text x="38"  y="220">C# 3%</text>
    <circle cx="154" cy="216" r="4" fill="#F05138"/><text x="164" y="220">Swift 2%</text>
    <circle cx="288" cy="216" r="4" fill="#563d7c"/><text x="298" y="220">CSS 1%</text>
    <circle cx="392" cy="216" r="4" fill="#8b949e"/><text x="402" y="220">Other 1%</text>
  </g>
</svg>
